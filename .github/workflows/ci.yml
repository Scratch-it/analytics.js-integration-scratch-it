name: CI

# Automated PR check for Scratch-it/analytics.js-integration-scratch-it (Vanta
# test "GitHub code changes have automated checks enabled"). Until this
# workflow the repo's only CI was a dead CircleCI 1.0 config (circle.yml,
# Node 4), so every PR had zero checks.
#
# Runs ESLint and the karma/mocha browser suite in headless Chrome. The tests
# stub the Scratch-it script load in-browser; no credentials, no secrets.
#
# Deliberately NO branch filter on `pull_request`: Vanta checks that ALL
# merged pull requests had automated checks, not just ones into master. No
# path filters either, for the same reason.
#
# `npm ci --ignore-scripts`: no install scripts are needed to lint or test.

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: "analytics.js-integration-scratch-it Unit Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Node (from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (npm ci, no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint
        run: make lint

      - name: Run browser unit tests (karma, headless Chrome)
        run: make test-browser KARMA_FLAGS="--single-run --browsers ChromeHeadlessCI"
